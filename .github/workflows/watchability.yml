name: Refresh watchability ratings

# Twice daily: 07:00 ET catches the finished slate and updated Elo, 12:00 ET
# catches probable pitchers that were announced late in the morning. Both are
# before first pitch for essentially every game.
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchability
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build ratings
        run: node scripts/build-watchability.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/watchability.json public/elo-state.json
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "chore(data): refresh watchability ratings"
          git push
